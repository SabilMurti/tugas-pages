 saw.\n- **4. Mentalitas Pemenang Orang Mukmin (HR. Muslim no. 2999):**  \n  Dapat kesenangan ia bersyukur, ditimpa kesulitan ia bersabar; seluruh urusannya berbuah kebaikan (*win-win*).\n\n---\n\n### [SLIDE 12] DISTINGSI BENCANA: BALA', MUSIBAH, AZAB, & ISTIDRAJ\n| Istilah | Ditujukan Kepada | Tujuan Teologis | Respons Hati & Indikator |\n|:---|:---|:---|:---|\n| **Bala' (Ujian)** | Para Nabi & Orang Shalih | Mengangkat derajat spiritual (*raf'ud darajat*) | Iman semakin kokoh, tawakal bertambah |\n| **Musibah** | Orang Beriman biasa | Penebusan dosa (*kafarat*) & teguran kasih sayang | Mendorong taubat & sadar dari kelalaian |\n| **Azab (Siksa)** | Pembangkang & Ahli Maksiat | Hukuman instan dan kehancuran di dunia | Marah, mencaci takdir, kian ingkar |\n| **Istidraj** | Pendosa yang sombong | Jebakan kenikmatan semu sebelum dibinasakan | Harta melimpah tapi maksiat terus jalan |\n\n---\n\n### [SLIDE 13] 4 TINGKATAN SIKAP MANUSIA (IBNU QAYYIM)\n1. **Level 1: Jaza' / Sakhat (Meratap & Murka) — [HARAM & DOSA BESAR]**  \n   Memprotes takdir Allah, merobek baju, histeris, menyakiti diri sendiri, dan putus asa.\n2. **Level 2: Shabr (Menahan Diri) — [MINIMAL WAJIB]**  \n   Hati merasa pedih dan air mata boleh menetes, namun lisan dan perbuatan tetap terkontrol patuh.\n3. **Level 3: Ridha (Rela & Berlapang Dada) — [SUNNAH / MUSTAHAB]**  \n   Menerima ketetapan Allah dengan dada lapang; yakin pilihan Allah adalah skenario terbaik.\n4. **Level 4: Syukur (Bersyukur atas Ujian) — [MAQAM TERTINGGI / IHSAN]**  \n   Memuji Allah karena menyadari musibah dunia menggugurkan dosa dan mencegah siksa akhirat.\n\n---\n\n### [SLIDE 14] 3 CABANG SABAR & REFLEKSI BUKU PAI SMK ERLANGGA\n*Relevansi Materi dengan Dunia Kejuruan / Vokasi (Drs. H. Sadi & H. Nasikin):*\n\n1. **Sabar dalam Ketaatan kepada Allah:**  \n   - Konsisten ibadah fardhu di tengah padatnya jam belajar/praktik bengkel.  \n   - Disiplin mematuhi SOP kerja, jadwal masuk, dan integritas etika profesi.\n2. **Sabar dalam Menjauhi Kemaksiatan:**  \n   - Menahan diri dari godaan pergaulan bebas, tawuran antar-sekolah.  \n   - Menolak manipulasi data laporan praktik, korupsi bahan, atau kelalaian K3.\n3. **Sabar dalam Menghadapi Takdir Pahit / Musibah:**  \n   - Tabah saat produk buatan gagal uji kompetensi (*Quality Control*).  \n   - Tangguh saat mengalami kendala penolakan magang PKL atau kerusakan mesin praktik.\n\n---\n\n### [SLIDE 15] SABAR SEBAGAI PONDASI KESEHATAN MENTAL (GEN-Z)\n1. **Mengubah Victim Mentality Menjadi Growth Mindset:**  \n   - Mengganti pertanyaan: *\"Kenapa harus aku yang tertimpa ini?\"*  \n   - Menjadi: *\"Apa evaluasi dan mentalitas baru yang ingin Allah bentuk dalam diriku?\"*\n2. **First-Aid Spiritual Emosi:**  \n   - Tarik nafas dalam-dalam saat menerima berita buruk, redam amarah, ucapkan kalimat *Istirja'*.\n3. **Sabar Aktif (*At-Tashabbur*):**  \n   - Sabar bukan berdiam diri pasrah!  \n   - Jika sakit: berobat ke dokter + doa.  \n   - Jika gagal nilai: evaluasi metode belajar + tawakal.\n4. **Solidaritas Sosial (*Takaful Ijtima'i*):**  \n   - Tidak menghakimi kawan yang berduka; hadirkan empati dan bantuan nyata.\n\n---\n\n### [SLIDE 16] KESIMPULAN & TAKEAWAY\n1. **Ujian adalah Sunnatullah:** Setiap manusia pasti diuji dengan porsi yang terukur (*bisyai-in*) untuk membuktikan kualitas iman.\n2. **Kekuatan Kalimat Istirja':** Mengikis arogansi kepemilikan (*semua milik Allah*) dan memberi ketenangan eskatologis (*semua akan kembali kepada-Nya*).\n3. **Kafarat Penghapus Dosa:** Sesuai hadis riwayat Az-Zuhri dalam Bukhari, setiap kepedihan fisik hingga duri yang menusuk bernilai pengampunan dosa.\n4. **Sabar adalah Otot yang Bisa Dilatih:** Melalui *at-tashabbur*, kesabaran adalah anugerah terluas untuk menjadi insan profesional berakhlak karimah.\n\n---\n\n### [SLIDE 17] PENUTUP & TANYA JAWAB (Q&A)\n**SESI DISKUSI & TANYA JAWAB**  \n*“Dan sampaikanlah kabar gembira kepada orang-orang yang sabar.” (Q.S. Al-Baqarah: 155)*\n\n- 🙋‍♂️ Silakan jika ada pertanyaan, tanggapan, atau kritik yang membangun.\n- 📖 Sumber Rujukan: *Shahih Al-Bukhari (Jalur Az-Zuhri), Shahih Muslim, Tafsir Ibnu Katsir, Tafsir Al-Mishbah, Buku PAI SMK Erlangga.*\n\n**Wassalamu’alaikum Warahmatullahi Wabarakatuh.**\n",
      qa: "# BANK TANYA JAWAB KRITIS & CHEATSHEET PRESENTASI\n## KAJIAN Q.S. AL-BAQARAH/2: 155–156 & HADIS TENTANG MUSIBAH\n\n> **Tujuan Dokumen:**  \n> Panduan \"senjata rahasia\" bagi presenter saat sesi tanya jawab (Q&A) dengan Guru atau Teman Sekelas, serta ringkasan cepat (*cheatsheet*) untuk persiapan ujian lisan maupun tertulis PAI & Budi Pekerti.\n\n---\n\n## BAGIAN I: BANK TANYA JAWAB KRITIS (KILLER QUESTIONS & JAWABAN ILMIAH)\n\n### Pertanyaan 1: Air Mata & Kesedihan\n> **Tanya:**  \n> *\"Jika seseorang menangis tersedu-sedu saat orang tuanya meninggal dunia atau saat gagal ujian, apakah itu berarti ia tidak sabar dan berdosa?\"*\n\n**Jawaban Presenter:**\n> *\"Terima kasih atas pertanyaan yang sangat bagus. **Menangis dan merasa sedih TIDAK membatalkan kesabaran**, dan hal itu sepenuhnya manusiawi serta mubah (bahkan bentuk kasih sayang).  \n> \n> Dalilnya adalah saat putra Rasulullah saw. bernama Ibrahim wafat. Air mata beliau menetes, lalu sahabat Abdurrahman bin Auf bertanya heran: 'Apakah engkau menangis wahai Rasulullah?' Maka Rasulullah saw. menjawab:  \n> *'Innal-'aina tadma'u wal-qalba yahzanu, wa la naqulu illa ma yardha Rabbuna'*  \n> *(Sesungguhnya mata boleh berlinang dan hati boleh bersedih, namun kami tidak mengatakan kecuali apa yang diridhai oleh Tuhan kami) [HR. Bukhari no. 1303].*  \n> \n> Yang **diharamkan dan merusak sabar** bukanlah tangisan air mata, melainkan **meratap (*niyahah*)**, yaitu:\n> 1. Mengucapkan kata-kata protes kepada takdir Allah (seperti: *'Mengapa harus anakku? Allah tidak adil!'*).\n> 2. Menyakiti fisik diri sendiri (menampar pipi, merobek baju, membenturkan kepala).\n> \n> Selama lisan terjaga dalam kalimat yang baik dan raga tidak berbuat histeris, meneteskan air mata adalah fitrah fitrah kasih sayang manusiawi yang dirahmati Allah.\"*\n\n---\n\n### Pertanyaan 2: Makna Kata *\"Bisyai-in\"* (Sedikit)\n> **Tanya:**  \n> *\"Dalam Q.S. Al-Baqarah ayat 155 disebutkan kata 'bisyai-in' yang artinya 'dengan sedikit'. Mengapa Allah menyebut ujian itu 'sedikit', padahal ada bencana tsunami, perang, atau penyakit kronis yang penderitaannya terasa amat dahsyat?\"*\n\n**Jawaban Presenter:**\n> *\"Pertanyaan yang sangat mendalam dan filosofis. Para mufassir seperti Syaikh Abdurrahman As-Sa'di dan Ibnu Katsir menjelaskan kata **بِشَيْءٍ (*bisyai-in*)** dari tiga perspektif teologis:\n> \n> 1. **Relatif terhadap Samudra Nikmat-Nya:** Jika seluruh penderitaan manusia dikumpulkan dan dibandingkan dengan nikmat bernapas, nikmat hidup, panca indera, dan keselamatan yang telah kita nikmati puluhan tahun, maka penderitaan itu nilainya sangat kecil/sedikit (*bisyai-in*).\n> 2. **Relatif terhadap Kapasitas Beban Maksimal:** Allah tidak pernah menurunkan ujian dalam kapasitas 100% yang mutlak memusnahkan manusia. Allah hanya memberikan 'sebagian kecil' dari rasa lapar dan takut, sesuai dengan batas kesanggupan manusia (*La yukallifullahu nafsan illa wus'aha*, Q.S. Al-Baqarah: 286).\n> 3. **Relatif terhadap Kehidupan Abadi di Akhirat:** Seluruh kepedihan dunia ini memiliki batas waktu (paling lama seumur hidup manusia, 60–80 tahun). Dibandingkan keabadian akhirat tanpa batas, penderitaan di dunia ini hanyalah sekejap mata belaka.\"*\n\n---\n\n### Pertanyaan 3: Sabar Aktif vs Kepasrahan Fatalistik\n> **Tanya:**  \n> *\"Apakah sikap orang yang sakit parah lalu menolak minum obat ke dokter dengan dalih 'saya ingin sabar menerima takdir Allah' dibenarkan dalam Islam?\"*\n\n**Jawaban Presenter:**\n> *\"Sikap tersebut **SALAH dan bertentangan dengan ajaran Islam**. Dalam akidah Islam dikenal distingsi antara **Sabar Aktif (*As-Shabru Al-Ijabiy*)** dan **Pasrah Fatalistik (*Al-Khunu' wal Istislam*)**.\n> \n> Sabar bukan berarti pasif menerima keburukan tanpa perlawanan. Rasulullah saw. sendiri secara tegas memerintahkan berobat dalam sabdanya:  \n> *'Tadawau 'ibadallah, fa innallaha 'azza wa jalla lam yadho' da-an illa wadha'a lahu syifa-an'*  \n> *(Berobatlah wahai hamba-hamba Allah, karena sesungguhnya Allah tidak menurunkan suatu penyakit melainkan menurunkan pula obat penawarnya) [HR. Abu Dawud & Tirmidzi].*\n> \n> **Pilar Sabar Islami adalah:**\n> 1. Mengendalikan hati agar tidak menyalahkan Allah.\n> 2. Berikhtiar maksimal secara medis/rasional untuk mencari kesembuhan atau jalan keluar.\n> 3. Menyerahkan hasil akhir (*tawakal*) sepenuhnya kepada Allah. Menolak ikhtiar bukanlah sabar, melainkan bentuk kebodohan (*jahl*) terhadap syariat.\"*\n\n---\n\n### Pertanyaan 4: Membedakan Musibah Ujian Derajat vs Azab Dosa\n> **Tanya:**  \n> *\"Bagaimana kita bisa tahu apakah musibah yang menimpa diri kita ini merupakan ujian untuk mengangkat derajat, ataukah hukuman/azab atas dosa-dosa kita?\"*\n\n**Jawaban Presenter:**\n> *\"Indikatornya bukan terletak pada wujud musibahnya, melainkan **pada respons hati dan dampak spiritual setelah musibah itu terjadi**:\n> \n> - **Ciri Ujian Pengangkat Derajat (*Bala' / Raf'ud Darajat*):**  \n>   Musibah tersebut membuat hati kita semakin lembut, shalat semakin khusyuk, doa semakin panjang, dan kita semakin dekat serta bersandar kepada Allah. (Contoh: ujian para Nabi dan orang-orang shalih).\n> - **Ciri Kafarat dan Teguran Kasih Sayang (*Tadzkir*):**  \n>   Musibah tersebut menyadarkan kita dari kelalaian, membuat kita segera bertaubat, beristighfar, dan menghentikan kebiasaan maksiat.\n> - **Ciri Azab atau Murka (*Iqab*):**  \n>   Musibah tersebut justru membuat seseorang semakin marah, mencela Tuhan, putus asa, dan lari ke pelampiasan maksiat yang lebih parah (misal: mabuk-mabukan atau bunuh diri).\n> \n> **Catatan Penting Beradab:**  \n> Untuk diri sendiri, kita harus selalu bersikap *muhasabah* (menganggap ini akibat dosa kita agar terdorong bertaubat). Namun jika melihat musibah orang lain, kita dilarang keras menuduh mereka sedang diazab; adab kita adalah berprasangka baik (*husnuzhan*) dan segera menolong mereka.\"*\n\n---\n\n### Pertanyaan 5: Fenomena Istidraj (Mengapa Orang Zalim Hidup Enak?)\n> **Tanya:**  \n> *\"Mengapa ada orang yang tidak pernah shalat, korupsi, dan suka maksiat tapi hidupnya kaya raya dan tidak pernah sakit, sementara orang yang rajin ibadah hidupnya sering tertimpa kesulitan?\"*\n\n**Jawaban Presenter:**\n> *\"Fenomena inilah yang disebut dalam Al-Qur'an dan Sunnah sebagai **ISTIDRAJ** (jebakan kenikmatan semu).\n> \n> Allah Swt. berfirman dalam Q.S. Al-An'am ayat 44:  \n> *'Maka ketika mereka melupakan peringatan yang telah diberikan kepada mereka, Kami pun membukakan semua pintu kesenangan untuk mereka; sehingga ketika mereka bergembira dengan apa yang telah diberikan kepada mereka, Kami siksa mereka secara tiba-tiba, maka ketika itu mereka terdiam berputus asa.'*\n> \n> Rasulullah saw. juga menegaskan:  \n> *'Jika engkau melihat Allah memberikan kepada seorang hamba kenikmatan dunia yang ia sukai padahal ia terus berada di atas kemaksiatannya, maka ketahuilah bahwa itu adalah ISTIDRAJ.'* [HR. Ahmad no. 17311].\n> \n> Bagi orang beriman, musibah di dunia adalah tanda Allah ingin 'mencicil' pengampunan dosanya agar di akhirat sudah bersih. Sedangkan bagi pendosa yang dibiarkan, dosanya 'ditabung' untuk dibalas secara penuh dan mengerikan di neraka kelak.\"*\n\n---\n\n### Pertanyaan 6: Kapan Kalimat Istirja' Dilafalkan?\n> **Tanya:**  \n> *\"Apakah kalimat Inna lillahi wa inna ilaihi raji'un hanya diucapkan saat ada orang yang meninggal dunia saja?\"*\n\n**Jawaban Presenter:**\n> *\"TIDAK hanya untuk kematian. Kalimat Istirja' disunnahkan untuk diucapkan **atas setiap peristiwa yang tidak disukai atau merugikan seorang muslim**, baik besar maupun kecil.\n> \n> Dalam riwayat Imam Al-Qurthubi disebutkan bahwa suatu ketika lampu penerangan milik Rasulullah saw. tiba-tiba padam karena kehabisan minyak. Maka beliau spontan mengucapkan: *'Innā lillāhi wa innā ilaihi rāji'ūn'*. Aisyah r.a. bertanya: *'Wahai Rasulullah, apakah lampu padam juga termasuk musibah?'* Beliau menjawab: *'Na'am, kullu syai-in yu'dzil mu'mina fa huwa mushībah'* (Ya, segala sesuatu yang menyusahkan atau mengganggu seorang mukmin adalah musibah dan ia berhak mendapat pahala atasnya).\n> \n> Jadi, ketika kita kehilangan pulpen, ban motor bocor saat berangkat sekolah, atau tersandung batu, sunnah hukumnya mengucapkan kalimat istirja'.\"*\n---\n\n### Pertanyaan 7: Kedudukan Hadis Jalur Az-Zuhri dalam Shahih Bukhari\n> **Tanya:**  \n> *\"Dalam riset kalian, kalian menyebutkan Hadis riwayat Bukhari melalui jalur Imam Az-Zuhri (no. 5640). Mengapa sanad ini begitu istimewa dalam literatur hadis musibah?\"*\n\n**Jawaban Presenter:**\n> *\"Pertanyaan yang luar biasa kritis! Ada dua alasan utama mengapa jalur periwayatan Imam Az-Zuhri ini sangat monumental:\n> 1. **Hadis Pembuka Kitab Musibah & Penyakit (*Kitab Al-Mardha*):**  \n>    Imam Al-Bukhari dengan sengaja meletakkan hadis jalur Az-Zuhri (dari 'Urwah, dari Ummul Mukminin Aisyah r.a.) sebagai **hadis nomor satu (pembuka)** pada Kitab Penyakit. Ini membuktikan bahwa di mata Imam Bukhari, hadis ini adalah fondasi teologis terkuat yang menetapkan bahwa setiap musibah—bahkan sekadar tertusuk duri—adalah sarana kafarat penghapus dosa.\n> 2. **Kredibilitas Sanad Emas (*Ashahhul Asanid*):**  \n>    Imam Ibnu Syihab Az-Zuhri adalah tokoh tabi'in yang memimpin kodifikasi hadis resmi atas perintah Khalifah Umar bin Abdul Aziz. Rantai sanad *Az-Zuhri ➔ 'Urwah ➔ 'Aisyah* adalah jalur keluarga langsung (Urwah adalah keponakan Aisyah), sehingga keshahihannya berada di puncak derajat ilmu hadis (*muttafaq 'alaih*).\"*\n\n---\n\n### Pertanyaan 8: Tiga Cabang Sabar Menurut Buku PAI SMK Erlangga\n> **Tanya:**  \n> *\"Buku PAI SMK Kelas XII Kurikulum Merdeka terbitan Erlangga membagi sabar ke dalam 3 cabang. Bagaimana penjelasannya jika dikaitkan dengan kehidupan siswa SMK?\"*\n\n**Jawaban Presenter:**\n> *\"Terima kasih. Buku PAI SMK Erlangga (karya Drs. H. Sadi & H. Nasikin) merujuk pada klasifikasi para ulama salaf yang membagi sabar menjadi 3 dimensi:\n> 1. **Sabar dalam Ketaatan kepada Allah:**  \n>    Menjaga konsistensi ibadah shalat 5 waktu dan kejujuran, serta dalam konteks SMK adalah disiplin menjalankan SOP bengkel/lab dan mematuhi jadwal PKL industri.\n> 2. **Sabar dalam Menjauhi Kemaksiatan:**  \n>    Menahan diri dari pergaulan bebas, tawuran, kecurangan ujian kompetensi, atau manipulasi data pekerjaan proyek.\n> 3. **Sabar dalam Menghadapi Takdir Pahit / Musibah:**  \n>    Ketabahan saat diuji dengan sakit jasmani, kecelakaan kerja, atau saat produk buatan kita gagal lolos *Quality Control*. Sabar di sini adalah pantang menyerah dan terus melakukan *troubleshooting* hingga berhasil.\"*\n\n---\n## BAGIAN II: CHEATSHEET CEPAT HAFALAN & KISI-KISI UJIAN\n\n### 1. Rumus Tajwid Cepat Q.S. Al-Baqarah: 155–156\n- **Qalqalah Sughra:** `وَلَنَبْلُوَنَّكُم` *(Huruf Ba' sukun di tengah kata)*\n- **Ghunnah Musyaddadah:** `وَلَنَبْلُوَنَّكُم` dan `إِنَّا` *(Huruf Nun bertasydid)*\n- **Idgham Bighunnah:** `بِشَيْءٍ مِّنَ` dan `وَنَقْصٍ مِّنَ` *(Tanwin bertemu Mim)*\n- **Alif Lam Qamariyah (Izhar Qamariyah):** `الْخَوْفِ` *(al + Kha)*, `الْأَمْوَالِ` *(al + Hamzah)*, `الْأَنفُسِ` *(al + Hamzah)*\n- **Alif Lam Syamsiyah (Idgham Syamsiyah):** `الثَّمَرَاتِ` *(al + Tsa)*, `الصَّابِرِينَ` *(al + Shad)*\n- **Ikhfa' Haqiqi:** `وَالْأَنفُسِ` *(Nun sukun bertemu Fa')*, `مُّصِيبَةٌ قَالُوا` *(Tanwin bertemu Qaf)*\n- **Idgham Mimi (Mislain):** `أَصَابَتْهُم مُّصِيبَةٌ` *(Mim sukun bertemu Mim berharakat)*\n- **Mad Jaiz Munfashil:** `إِذَا أَصَابَتْهُم`, `قَالُوا إِنَّا`, `وَإِنَّا إِلَيْهِ` *(Mad Thabi'i bertemu hamzah di lain kata)*\n- **Lam Tarqiq (Tipis):** `لِلَّهِ` *(Lafal Allah didahului kasrah)*\n- **Mad 'Aridh Lissukun:** `الصَّابِرِينَ` dan `رَاجِعُونَ` *(Mad Thabi'i di akhir kata sebelum waqaf)*\n\n---\n\n### 2. Lima (5) Ujian dalam Ayat 155 (Urutan Teks Al-Qur'an)\n1. **الْخَوْفِ (*Al-Khauf*):** Rasa takut & kecemasan.\n2. **الْجُوعِ (*Al-Jū'*):** Rasa lapar & ketiadaan pangan.\n3. **نَقْصٍ مِّنَ الْأَمْوَالِ (*Naqshin minal amwāl*):** Kekurangan/kehilangan harta benda.\n4. **الْأَنفُسِ (*Al-Anfus*):** Kematian jiwa & derita penyakit fisik.\n5. **الثَّمَرَاتِ (*Ats-Tsamarāt*):** Kekurangan buah-buahan / gagal panen & kegagalan hasil usaha.\n\n---\n\n### 3. Tiga (3) Hadiah bagi Orang Sabar dalam Ayat 157\n1. **صَلَوَاتٌ مِّن رَّبِّهِمْ (*Shalawātun min Rabbihim*):** Keberkahan, ampunan, dan sanjungan dari Allah di hadapan para malaikat.\n2. **رَحْمَةٌ (*Rahmah*):** Rahmat, kasih sayang, dan ketenangan jiwa.\n3. **الْمُهْتَدُونَ (*Al-Muhtadūn*):** Petunjuk jalan yang lurus dalam menghadapi setiap problematika hidup.\n\n---\n\n### 4. Hadis-Hadis Shahih Kunci & Takhrij Sanad\n| Hadis & Sanad Kunci | Matan / Potongan Kunci | Poin Inti & Kedudukan |\n|:---|:---|:---|\n| **HR. Bukhari no. 5640** *(Jalur Emas Az-Zuhri ➔ Urwah ➔ Aisyah r.a.)* | *Mā min mushībatin tushībul muslima illā kaffarallāhu bihā 'anhu, hattasy-syaukati yusyākuhā* | **Hadis pembuka Kitab Penyakit (*Kitab Al-Mardha*)**: Duri yang menusuk pun jadi kafarat dosa. |\n| **HR. Bukhari no. 1469 & 6470** *(Jalur Az-Zuhri ➔ Atha' ➔ Abu Sa'id r.a.)* | *Wa man yatashabbar yushabbirhullāh, wa mā u'thiya ahadun 'athā-an khairan wa awsa'a minash-shabr* | **Sabar adalah keahlian yang dilatih (*at-tashabbur*)** dan merupakan anugerah terluas bagi manusia. |\n| **HR. Bukhari no. 5641 & Muslim no. 2573** *(Abu Sa'id & Abu Hurairah)* | *Mā yushībul muslima min nashabin wa lā washābin... illā kaffarallāh...* | Merangkum 6 spektrum stres & lelah fisik/psikis sebagai pembersih noda dosa. |\n| **HR. Bukhari no. 1283 & Muslim no. 926** *(Anas bin Malik)* | *Innamash-shabru 'inda ash-shadmatil ula* | Tolok ukur nilai kesabaran tertinggi ada pada detik hentakan/benturan pertama. |\n| **HR. Muslim no. 918 & Ahmad** *(Ummu Salamah)* | *Allāhumma'-jurnī fī mushībatī wa akhlif lī khairan minhā* | Doa mustajab saat tertimpa musibah agar digantikan hal yang jauh lebih mulia. |\n| **HR. Muslim no. 2999** *(Shuhaib Ar-Rumi)* | *In ashabathu sarra-u syakara... wa in ashabathu dharra-u shabara* | Pola pikir mental juara orang beriman: beruntung saat senang (syukur) & susah (sabar). |\n| **HR. Tirmidzi no. 2396** *(Anas bin Malik)* | *Inna 'izhamal-jazā'i ma'a 'izhamil-balā'* | Besarnya pahala berbanding lurus dengan beratnya ujian hidup; tanda cinta Allah. |\n\n---\n\n### 5. Empat (4) Tingkatan Manusia Menghadapi Musibah (Ibnu Qayyim)\n1. **Al-Jaza' / As-Sakhat (Meratap & Murka):** Hukumnya **Haram**.\n2. **Ash-Shabr (Menahan Diri):** Hukumnya **Wajib**.\n3. **Ar-Ridha (Rela & Berlapang Dada):** Hukumnya **Sunnah / Mustahab**.\n4. **Asy-Syukr (Bersyukur atas Hikmahnya):** Tingkatan tertinggi (**Maqam Ihsan**).\n",
    };

    function switchTab(key) {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.className = 'tab-btn px-4 py-2 text-xs font-bold rounded-lg text-slate-600 hover:bg-slate-100';
      });
      document.getElementById('tab-btn-' + key).className = 'tab-btn px-4 py-2 text-xs font-bold rounded-lg bg-emerald-600 text-white shadow-xs';
      
      const raw = docs[key] || '';
      document.getElementById('content-area').innerHTML = marked.parse(raw);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Default load makalah
    switchTab('makalah');
  </script>
